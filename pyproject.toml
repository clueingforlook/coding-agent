[project]
name = "mini-claude-code"
version = "0.1.0"
description = "支持上下文管理、长期记忆与多 Agent 协作的命令行编程助手"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28,<1",
    "python-dotenv>=1,<2",
    "pyyaml>=6,<7",
]

[project.scripts]
minicc = "minicc.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["minicc"]
